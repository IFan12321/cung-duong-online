<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đền Thờ Quan Công - Cầu An & Cúng dường</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=Playfair+Display:ital,wght@1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b0704;
            color: #f3e5ab;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 30px;
            overflow-x: hidden;
        }

        .header-title {
            text-align: center;
            margin: 15px 10px 5px 10px;
        }

        .header-title h1 {
            font-family: 'Be Vietnam Pro', sans-serif;
            font-weight: 800;
            font-size: 2rem;
            color: #ffd700;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .header-title p {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #d4af37;
            font-size: 1rem;
        }

        /* Khung chứa ảnh đền thờ */
        .shrine-wrapper {
            position: relative;
            width: 95%;
            max-width: 950px;
            aspect-ratio: 16 / 9;
            margin: 10px auto;
            border: 3px solid #d4af37;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 25px rgba(212, 175, 55, 0.4);
            overflow: hidden;
            background-color: #1a0f07;
        }

        .shrine-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Vị trí 3 cây nhang và khói cắm vào bát hương to phía sau */
        .incense-position {
            position: absolute;
            left: 50%;
            bottom: 39%; /* Đã đưa dịch lên bát hương to phía sau */
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        /* 3 cây nhang */
        .sticks-group {
            display: flex;
            gap: 8px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.6s ease-in-out;
        }

        .sticks-group.active {
            opacity: 1;
            transform: translateY(0);
        }

        .stick {
            width: 4px;
            height: 40px;
            background: linear-gradient(to bottom, #d2691e, #652b0c);
            position: relative;
            border-radius: 2px;
            box-shadow: 0 0 4px rgba(0,0,0,0.8);
        }

        /* Đầu nhang đỏ lửa phát sáng */
        .stick::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -1.5px;
            width: 7px;
            height: 7px;
            background: #ff2200;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff3300, 0 0 15px #ff0000, 0 0 25px #ff9900;
            animation: glow 1s infinite alternate ease-in-out;
        }

        @keyframes glow {
            0% { opacity: 0.7; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.4); }
        }

        /* Khói nhang bay nhiều và dày hơn */
        .smoke-group {
            position: absolute;
            bottom: 35px;
            display: flex;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .smoke-group.active {
            opacity: 1;
        }

        .smoke-particle {
            width: 16px;
            height: 110px;
            background: linear-gradient(to top, rgba(255,255,255,0.8), rgba(230,230,230,0));
            filter: blur(8px);
            border-radius: 50%;
            animation: rise 2.4s infinite linear;
        }

        .smoke-particle:nth-child(1) { animation-delay: 0s; animation-duration: 2.2s; }
        .smoke-particle:nth-child(2) { animation-delay: 0.5s; animation-duration: 2.7s; }
        .smoke-particle:nth-child(3) { animation-delay: 0.2s; animation-duration: 2.4s; }

        @keyframes rise {
            0% {
                transform: translateY(0) scaleX(0.8) rotate(0deg);
                opacity: 0;
            }
            15% { opacity: 0.9; }
            100% {
                transform: translateY(-160px) scaleX(5) rotate(30deg);
                opacity: 0;
            }
        }

        /* Hiệu ứng chữ chớp tắt 2 bên khi thắp nhang */
        .side-banner {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 180px;
            padding: 15px 10px;
            background: rgba(15, 8, 3, 0.85);
            border: 2px solid #ffd700;
            border-radius: 8px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            z-index: 15;
            pointer-events: none;
        }

        .side-banner.active {
            opacity: 1;
            animation: blinkEffect 1.5s infinite alternate;
        }

        .side-banner.left { left: 15px; }
        .side-banner.right { right: 15px; }

        .side-banner span {
            font-family: 'Be Vietnam Pro', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            color: #ffd700;
            text-shadow: 0 0 10px #ff3300, 0 0 20px #ffd700;
            line-height: 1.4;
            display: block;
        }

        @keyframes blinkEffect {
            0% { opacity: 0.5; filter: brightness(0.7); }
            100% { opacity: 1; filter: brightness(1.3); }
        }

        /* Khung nhập lời nguyện */
        .control-box {
            width: 90%;
            max-width: 650px;
            background: rgba(20, 12, 6, 0.9);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 18px;
            margin: 12px auto;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            text-align: center;
        }

        .control-box h2 {
            font-family: 'Be Vietnam Pro', sans-serif;
            color: #ffd700;
            font-size: 1.05rem;
            margin-bottom: 10px;
        }

        .wish-textarea {
            width: 100%;
            height: 75px;
            background-color: #0a0502;
            border: 1px solid #b38728;
            border-radius: 6px;
            color: #fff;
            padding: 10px;
            font-size: 0.95rem;
            font-family: 'Montserrat', sans-serif;
            resize: none;
            outline: none;
        }

        .wish-textarea:focus {
            border-color: #ffd700;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
        }

        .btn-incense {
            margin-top: 10px;
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, #d4af37 0%, #aa771c 100%);
            color: #120a04;
            font-family: 'Be Vietnam Pro', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-incense:hover {
            background: linear-gradient(135deg, #ffd700 0%, #c59b27 100%);
            transform: translateY(-2px);
        }

        #message {
            margin-top: 10px;
            font-size: 0.9rem;
            font-style: italic;
            min-height: 20px;
            color: #ffd700;
        }

        /* Responsive cho màn hình nhỏ */
        @media(max-width: 768px) {
            .side-banner { display: none; } /* Ẩn 2 bên trên mobile cho gọn giao diện */
        }
    </style>
</head>
<body>

    <div class="header-title">
        <h1>ĐỀN THỜ QUAN CÔNG</h1>
        <p>“Hạo nhiên chính khí - Trung nghĩa thiên thu”</p>
    </div>

    <!-- Khung Bàn Thờ -->
    <div class="shrine-wrapper">
        <img class="shrine-img" src="quancong.jpg" alt="Đền Thờ Quan Công Đọc Sách">
        
        <!-- Hiệu ứng chữ chớp tắt 2 bên -->
        <div class="side-banner left" id="bannerLeft">
            <span>VẠN SỰ<br>KHỞI ĐẦU NAN</span>
        </div>
        <div class="side-banner right" id="bannerRight">
            <span>GIAN NAN<br>ĐỪNG CÓ NẢN</span>
        </div>

        <!-- Vị trí 3 nén nhang & làn khói dày cắm vào bát hương to phía sau -->
        <div class="incense-position">
            <div class="smoke-group" id="smokeGroup">
                <div class="smoke-particle"></div>
                <div class="smoke-particle"></div>
                <div class="smoke-particle"></div>
            </div>
            <div class="sticks-group" id="sticksGroup">
                <div class="stick"></div>
                <div class="stick"></div>
                <div class="stick"></div>
            </div>
        </div>
    </div>

    <!-- Bảng tương tác -->
    <div class="control-box">
        <h2>NHẬP LỜI NGUYỆN ƯỚC THÀNH TÂM</h2>
        <textarea id="wishInput" class="wish-textarea" placeholder="Ví dụ: Cầu mong gia đạo bình an, công việc hanh thông, vạn sự cát tường..."></textarea>
        <button class="btn-incense" onclick="thapNhang()">🙏 Thắp Nhang & Gửi Nguyện Ước</button>
        <div id="message"></div>
    </div>

    <script>
        function thapNhang() {
            const wish = document.getElementById('wishInput').value.trim();
            const sticksGroup = document.getElementById('sticksGroup');
            const smokeGroup = document.getElementById('smokeGroup');
            const bannerLeft = document.getElementById('bannerLeft');
            const bannerRight = document.getElementById('bannerRight');
            const message = document.getElementById('message');

            if (!wish) {
                message.style.color = '#ff6b6b';
                message.innerText = 'Vui lòng nhập lời nguyện ước trước khi thắp nhang!';
                return;
            }

            // Kích hoạt hiệu ứng nhang, khói và chữ chớp tắt 2 bên
            sticksGroup.classList.add('active');
            smokeGroup.classList.add('active');
            bannerLeft.classList.add('active');
            bannerRight.classList.add('active');

            message.style.color = '#00ffcc';
            message.innerText = '✨ Đã thành tâm thắp 3 nén nhang lớn. Cầu mong nguyện ước của bạn được Quan Thánh chứng giám!';
        }
    </script>

</body>
</html>
