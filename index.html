<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đền Thờ Quan Thánh Đế Quân - Cúng Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a0803;
            background-image: radial-gradient(#3a1507 1px, transparent 0);
            background-size: 20px 20px;
            font-family: 'Noto Serif', 'Times New Roman', serif;
            color: #f4e8c1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .temple-wrapper {
            width: 100%;
            max-width: 650px;
            background: linear-gradient(to bottom, #2d0b03, #150501);
            border: 4px solid #d4af37;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2), 0 10px 40px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            position: relative;
        }

        /* --- MÁI ĐỀN TRANG NHIÊM --- */
        .roof-container {
            position: relative;
            background: #8b0000;
            text-align: center;
            padding: 15px 10px 10px;
            border-bottom: 5px solid #d4af37;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }

        /* Mái cong Trung Hoa bằng SVG */
        .roof-svg {
            width: 100%;
            height: 60px;
            display: block;
            margin-bottom: -10px;
        }

        .temple-title {
            color: #ffd700;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #ff4500, 2px 2px 4px #000;
            margin-top: 5px;
        }

        .couplet-bar {
            color: #f39c12;
            font-size: 13px;
            margin-top: 4px;
            letter-spacing: 1px;
            font-style: italic;
        }

        /* --- DIỆN TÍCH BÊN TRONG ĐỀN THỜ --- */
        .sanctuary-room {
            position: relative;
            height: 420px;
            background: linear-gradient(to bottom, #4a1005 0%, #200601 80%, #110300 100%);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            border-bottom: 6px solid #5a1e05;
        }

        /* Câu đối hai bên cột */
        .pillar {
            position: absolute;
            top: 0;
            bottom: 60px;
            width: 36px;
            background: linear-gradient(to right, #600000, #a00000, #400000);
            border-left: 2px solid #ffd700;
            border-right: 2px solid #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .pillar.left { left: 12px; }
        .pillar.right { right: 12px; }
        .pillar-text {
            writing-mode: vertical-rl;
            color: #ffd700;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 6px;
            text-shadow: 1px 1px 2px #000;
        }

        /* Khung Thờ Chính Trung Tâm */
        .shrine-arch {
            position: absolute;
            top: 15px;
            width: 340px;
            height: 330px;
            border: 3px solid #d4af37;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            background: radial-gradient(circle, #5e1405 20%, #1c0501 90%);
            border-radius: 8px 8px 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 15px;
        }

        /* Bức thư pháp sau lưng Quan Công */
        .calligraphy-scroll {
            position: absolute;
            top: 25px;
            background: #edd59e;
            color: #8b0000;
            padding: 6px 16px;
            border: 2px solid #8b0000;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 4px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
            z-index: 2;
        }

        /* SVG Quan Công Đọc Sách & Thanh Long Đao */
        .statue-container {
            position: absolute;
            top: 65px;
            width: 260px;
            height: 250px;
            z-index: 3;
        }

        /* --- BÀN THỜ VÀ LƯ HƯƠNG --- */
        .altar-table {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: linear-gradient(to bottom, #8b4513, #421d05);
            border-top: 4px solid #d4af37;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            z-index: 20;
        }

        /* Lư Hương Đồng */
        .incense-burner-wrap {
            position: relative;
            top: -30px;
            width: 80px;
            height: 55px;
        }

        /* 3 Cây Nhang & Khói */
        .incense-sticks {
            position: absolute;
            top: -42px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 50px;
            display: none;
            z-index: 25;
        }

        .stick {
            position: absolute;
            bottom: 0;
            width: 3px;
            height: 45px;
            background: linear-gradient(to top, #b33939, #e67e22);
            border-radius: 1px;
        }
        .stick.s1 { left: 6px; transform: rotate(-6deg); }
        .stick.s2 { left: 16px; }
        .stick.s3 { left: 26px; transform: rotate(6deg); }

        /* Đốm đỏ đầu nhang */
        .stick::before {
            content: '';
            position: absolute;
            top: 0;
            left: -1px;
            width: 5px;
            height: 5px;
            background: #ff3838;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff4d4d, 0 0 12px #fffa65;
        }

        /* Làn Khói Nhang Animation */
        .smoke-particle {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 16px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            filter: blur(5px);
            opacity: 0;
        }

        .active-smoke .smoke-particle {
            animation: burnSmoke 3s infinite ease-out;
        }
