<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đền Thờ Quan Công - Cúng Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2b1207;
            font-family: 'Noto Serif', serif;
            color: #f4e8c1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .temple-container {
            width: 100%;
            max-width: 600px;
            background: linear-gradient(to bottom, #4a1505, #2b1207);
            border: 4px solid #d4af37;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
            text-align: center;
            padding-bottom: 20px;
        }

        /* Banner Đền Thờ */
        .temple-roof {
            background-color: #8b0000;
            padding: 15px;
            border-bottom: 3px solid #d4af37;
        }

        .temple-roof h1 {
            color: #ffd700;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-subtype: 2px;
        }

        /* Khu vực hiển thị Quan Công & Thanh Đao */
        .sanctuary-scene {
            position: relative;
            height: 320px;
            background: radial-gradient(circle, #5c1806 0%, #2b0b02 100%);
            border-bottom: 4px solid #8b4513;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Thanh đao phía sau lưng */
        .guan-dao {
            position: absolute;
            top: 10px;
            width: 12px;
            height: 280px;
            background: linear-gradient(to right, #b8860b, #ffd700, #b8860b);
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .guan-dao::before {
            content: '';
            position: absolute;
            top: -25px;
            left: -14px;
            width: 40px;
            height: 50px;
            background: #d4af37;
            clip-path: polygon(50% 0%, 100% 40%, 80% 100%, 20% 100%, 0% 40%);
        }

        /* Tượng/Ảnh Quan Công đọc sách */
        .guan-yu-statue {
            position: relative;
            z-index: 2;
            width: 130px;
            height: 180px;
            background: #c0392b;
            border-radius: 60px 60px 10px 10px;
            border: 3px solid #ffd700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }
        .guan-yu-statue .book {
            width: 50px;
            height: 35px;
            background: #f4e8c1;
            border: 1px solid #333;
            margin-top: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .guan-yu-statue .label-name {
            margin-top: 10px;
            font-size: 14px;
            color: #ffd700;
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* Bàn thờ & Lư hương */
        .altar-table {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: #8b4513;
            border-top: 4px solid #d4af37;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .incense-burner {
            position: relative;
            bottom: 25px;
            width: 70px;
            height: 45px;
            background: radial-gradient(circle, #e67e22, #b9770e);
            border-radius: 0 0 35px 35px;
            border: 2px solid #f1c40f;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        /* 3 Cây Nhang & Khói */
        .incense-sticks-container {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            width: 30px;
            height: 60px;
        }

        .stick {
            position: absolute;
            bottom: 0;
            width: 2px;
            height: 50px;
            background: #d35400;
        }
        .stick:nth-child(1) { left: 4px; transform: rotate(-5deg); }
        .stick:nth-child(2) { left: 14px; }
        .stick:nth-child(3) { left: 24px; transform: rotate(5deg); }

        /* Đốm lửa đỏ đầu nhang */
        .stick::after {
            content: '';
            position: absolute;
            top: 0;
            left: -1px;
            width: 4px;
            height: 4px;
            background: #e74c3c;
            border-radius: 50%;
            box-shadow: 0 0 6px #ff0000;
        }

        /* Hiệu ứng khói */
        .smoke {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            animation: riseSmoke 2.5s infinite linear;
            opacity: 0;
        }

        @keyframes riseSmoke {
            0% { transform: translate(-50%, 0) scale(0.5); opacity: 0.8; }
            50% { transform: translate(calc(-50% + 10px), -25px) scale(1.2); opacity: 0.4; }
            100% { transform: translate(calc(-50% - 10px), -50px) scale(1.8); opacity: 0; }
        }

        .active-smoke .smoke {
            opacity: 1;
        }

        /* Phần nhập nguyện ước & Nút Thắp Nhang */
        .control-panel {
            padding: 20px;
            background: #361709;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #d4af37;
            background: #1e0a03;
            color: #f4e8c1;
            font-family: 'Noto Serif', serif;
            font-size: 15px;
            resize: none;
            outline: none;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        textarea::placeholder {
            color: #bfa87a;
        }

        .btn-light-incense {
            margin-top: 15px;
            background: linear-gradient(to bottom, #e67e22, #d35400);
            color: #ffffff;
            border: 2px solid #f1c40f;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: all 0.2s ease;
            font-family: 'Noto Serif', serif;
        }

        .btn-light-incense:hover {
            background: linear-gradient(to bottom, #d35400, #ba4a00);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(212, 175, 55, 0.4);
        }

        .wish-notification {
            margin-top: 15px;
            font-style: italic;
            color: #ffd700;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="temple-container">
        <!-- Tiêu đề đền -->
        <div class="temple-roof">
            <h1>ĐỀN THỜ QUAN THÁNH ĐẾ QUÂN</h1>
        </div>

        <!-- Không gian thờ tự -->
        <div class="sanctuary-scene">
            <!-- Thanh đao phía sau -->
            <div class="guan-dao"></div>

            <!-- Tượng Quan Công đọc sách -->
            <div class="guan-yu-statue">
                <div class="book"></div>
                <div class="label-name">QUAN CÔNG</div>
            </div>

            <!-- Bàn thờ & Lư hương -->
            <div class="altar-table">
                <div class="incense-burner">
                    <!-- 3 Cây nhang và làn khói -->
                    <div class="incense-sticks-container" id="incenseSticks">
                        <div class="stick"></div>
                        <div class="stick"></div>
                        <div class="stick"></div>
                        <div class="smoke"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bảng nhập nguyện ước -->
        <div class="control-panel">
            <textarea id="wishInput" placeholder="Nhập nguyện ước của bạn gửi đến Quan Công..."></textarea>
            <br>
            <button class="btn-light-incense" onclick="lightIncense()">THẮP NHANG</button>
            <div class="wish-notification" id="notification"></div>
        </div>
    </div>

    <!-- Tích hợp âm nhạc nền (Chị thay link nhạc hoặc tên tệp vào src giúp em nhé) -->
    <audio id="bgMusic" loop>
        <!-- Chị có thể đặt file nhạc cùng thư mục và đổi tên thành 'nhạc.mp3' hoặc dán link online vào đây -->
        <source src="nhac.mp3" type="audio/mpeg">
        Trình duyệt của bạn không hỗ trợ thẻ audio.
    </audio>

    <script>
        function lightIncense() {
            const wishText = document.getElementById('wishInput').value.trim();
            const incenseSticks = document.getElementById('incenseSticks');
            const notification = document.getElementById('notification');
            const music = document.getElementById('bgMusic');

            if (wishText === "") {
                alert("Xin vui lòng điền nguyện ước của bạn trước khi thắp nhang!");
                return;
            }

            // Hiển thị 3 cây nhang và khói
            incenseSticks.style.display = 'block';
            incenseSticks.classList.add('active-smoke');

            // Phát nhạc nền
            music.play().catch(error => {
                console.log("Trình duyệt chặn phát tự động hoặc chưa tìm thấy tệp nhạc nhac.mp3");
            });

            // Hiển thị thông báo gửi nguyện ước thành công
            notification.innerHTML = "🙏 Nguyện ước của bạn đã được Quan Thánh chứng giám!";
            
            // Xóa nội dung ô nhập sau khi thắp
            document.getElementById('wishInput').value = "";
        }
    </script>

</body>
</html>
