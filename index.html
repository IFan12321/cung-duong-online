<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đền Thờ Quan Công - Cầu An</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=Playfair+Display:ital,wght@1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b0704;
            color: #f3e5ab;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 30px;
        }

        .header-title {
            text-align: center;
            margin: 20px 10px 10px 10px;
        }

        .header-title h1 {
            font-family: 'Be Vietnam Pro', sans-serif;
            font-weight: 800;
            font-size: 2.2rem;
            color: #ffd700;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .header-title p {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #d4af37;
            font-size: 1.1rem;
        }

        /* Khung chứa ảnh đền thờ */
        .shrine-wrapper {
            position: relative;
            width: 95%;
            max-width: 950px;
            aspect-ratio: 16 / 9;
            margin: 10px auto;
            border: 3px solid #d4af37;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 25px rgba(212, 175, 55, 0.4);
            overflow: hidden;
            background-color: #1a0f07;
        }

        .shrine-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Vị trí cắm 3 cây nhang to và khói ngay miệng lư hương */
        .incense-position {
            position: absolute;
            left: 50%;
            bottom: 27%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        /* 3 cây nhang to */
        .sticks-group {
            display: flex;
            gap: 12px;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.6s ease-in-out;
        }

        .sticks-group.active {
            opacity: 1;
            transform: translateY(0);
        }

        .stick {
            width: 6px;
            height: 55px;
            background: linear-gradient(to bottom, #d2691e, #652b0c);
            position: relative;
            border-radius: 2px;
            box-shadow: 0 0 4px rgba(0,0,0,0.8);
        }

        /* Đầu nhang đỏ lửa phát sáng mạnh */
        .stick::before {
            content: '';
            position: absolute;
            top: -6px;
            left: -2px;
            width: 10px;
            height: 10px;
            background: #ff2200;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff3300, 0 0 20px #ff0000, 0 0 30px #ff9900;
            animation: glow 1s infinite alternate ease-in-out;
        }

        @keyframes glow {
            0% { opacity: 0.7; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.4); }
        }

        /* Hiệu ứng khói nhang dày bay lên */
        .smoke-group {
            position: absolute;
            bottom: 45px;
            display: flex;
            gap: 15px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .smoke-group.active {
            opacity: 1;
        }

        .smoke-particle {
            width: 14px;
            height: 90px;
            background: linear-gradient(to top, rgba(255,255,255,0.7), rgba(230,230,230,0));
            filter: blur(7px);
            border-radius: 50%;
            animation: rise 2.8s infinite linear;
        }

        .smoke-particle:nth-child(1) { animation-delay: 0s; animation-duration: 2.5s; }
        .smoke-particle:nth-child(2) { animation-delay: 0.8s; animation-duration: 3.2s; }
        .smoke-particle:nth-child(3) { animation-delay: 0.4s; animation-duration: 2.9s; }

        @keyframes rise {
            0% {
                transform: translateY(0) scaleX(0.8) rotate(0deg);
                opacity: 0;
            }
            20% { opacity: 0.8; }
            100% {
                transform: translateY(-130px) scaleX(4) rotate(20deg);
                opacity: 0;
            }
        }

        /* Khung nhập lời nguyện */
        .control-box {
            width: 90%;
            max-width: 650px;
            background: rgba(20, 12, 6, 0.9);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 20px;
            margin: 15px auto;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            text-align: center;
        }

        .control-box h2 {
            font-family: 'Be Vietnam Pro', sans-serif;
            color: #ffd700;
            font-size: 1.1rem;
            margin-bottom: 12px;
        }

        .wish-textarea {
            width: 100%;
            height: 85px;
            background-color: #0a0502;
            border: 1px solid #b38728;
            border-radius: 6px;
            color: #fff;
            padding: 10px;
            font-size: 0.95rem;
            font-family: 'Montserrat', sans-serif;
            resize: none;
            outline: none;
        }

        .wish-textarea:focus {
            border-color: #ffd700;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
        }

        .btn-incense {
            margin-top: 12px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #d4af37 0%, #aa771c 100%);
            color: #120a04;
            font-family: 'Be Vietnam Pro', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-incense:hover {
            background: linear-gradient(135deg, #ffd700 0%, #c59b27 100%);
            transform: translateY(-2px);
        }

        #message {
            margin-top: 12px;
            font-size: 0.95rem;
            font-style: italic;
            min-height: 22px;
            color: #ffd700;
        }
    </style>
</head>
<body>

    <div class="header-title">
        <h1>ĐỀN THỜ QUAN CÔNG</h1>
        <p>“Hạo nhiên chính khí - Trung nghĩa thiên thu”</p>
    </div>

    <!-- Khung Bàn Thờ -->
    <div class="shrine-wrapper">
        <img class="shrine-img" src="quancong.jpg" alt="Đền Thờ Quan Công Đọc Sách">
        
        <!-- Vị trí 3 nén nhang to & làn khói dày đặc -->
        <div class="incense-position">
            <div class="smoke-group" id="smokeGroup">
                <div class="smoke-particle"></div>
                <div class="smoke-particle"></div>
                <div class="smoke-particle"></div>
            </div>
            <div class="sticks-group" id="sticksGroup">
                <div class="stick"></div>
                <div class="stick"></div>
                <div class="stick"></div>
            </div>
        </div>
    </div>

    <!-- Bảng tương tác -->
    <div class="control-box">
        <h2>NHẬP LỜI NGUYỆN ƯỚC THÀNH TÂM</h2>
        <textarea id="wishInput" class="wish-textarea" placeholder="Ví dụ: Cầu mong gia đạo bình an, công việc hanh thông, vạn sự cát tường..."></textarea>
        <button class="btn-incense" onclick="thapNhang()">🙏 Thắp Nhang & Gửi Nguyện Ước</button>
        <div id="message"></div>
    </div>

    <script>
        function thapNhang() {
            const wish = document.getElementById('wishInput').value.trim();
            const sticksGroup = document.getElementById('sticksGroup');
            const smokeGroup = document.getElementById('smokeGroup');
            const message = document.getElementById('message');

            if (!wish) {
                message.style.color = '#ff6b6b';
                message.innerText = 'Vui lòng nhập lời nguyện ước trước khi thắp nhang!';
                return;
            }

            // Hiển thị 3 nén nhang to và khói bốc lên ngút ngàn
            sticksGroup.classList.add('active');
            smokeGroup.classList.add('active');

            message.style.color = '#00ffcc';
            message.innerText = '✨ Đã thành tâm thắp 3 nén nhang lớn. Cầu mong nguyện ước của bạn được Quan Thánh chứng giám!';
        }
    </script>

</body>
</html>
