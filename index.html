<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đền Thờ Quan Thánh Đế Quân - Cúng Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #120301;
            background-image: radial-gradient(#2c0a03 1px, transparent 0);
            background-size: 20px 20px;
            font-family: 'Noto Serif', serif;
            color: #f4e8c1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .temple-wrapper {
            width: 100%;
            max-width: 550px;
            background: linear-gradient(to bottom, #2b0802, #0d0200);
            border: 4px solid #d4af37;
            border-radius: 12px;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.25), 0 10px 40px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            position: relative;
        }

        /* --- MÁI ĐỀN THỜ --- */
        .roof-header {
            background: linear-gradient(to bottom, #8b0000, #4a0000);
            text-align: center;
            padding: 15px 10px;
            border-bottom: 4px solid #d4af37;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }

        .temple-title {
            color: #ffd700;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #ff4500, 2px 2px 4px #000;
        }

        .temple-subtitle {
            color: #f39c12;
            font-size: 13px;
            margin-top: 5px;
            font-style: italic;
        }

        /* --- KHU VỰC THỜ TỰ CHÍNH --- */
        .sanctuary-room {
            position: relative;
            height: 400px;
            background: radial-gradient(circle, #4a1005 10%, #150301 90%);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            border-bottom: 6px solid #4a1902;
        }

        /* Ảnh Quan Công Đọc Sách & Thanh Long Đao */
        .quan-cong-img {
            position: absolute;
            top: 10px;
            height: 310px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.3));
            z-index: 2;
        }

        /* BÀN THỜ VÀ LƯ HƯƠNG */
        .altar-table {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(to bottom, #5c2605, #260f01);
            border-top: 4px solid #d4af37;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            z-index: 10;
        }

        /* Khung Lư Hương */
        .burner-container {
            position: relative;
            top: -35px;
            width: 110px;
            height: 90px;
            display: flex;
            justify-content: center;
        }

        .burner-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
            position: relative;
            z-index: 12;
        }

        /* 3 CÂY NHANG & KHÓI */
        .incense-sticks {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 60px;
            display: none;
            z-index: 11;
        }

        .stick {
            position: absolute;
            bottom: 0;
            width: 3px;
            height: 50px;
            background: linear-gradient(to top, #8e1818, #e67e22);
            border-radius: 1px;
        }
        .stick.s1 { left: 8px; transform: rotate(-5deg); }
        .stick.s2 { left: 18px; }
        .stick.s3 { left: 28px; transform: rotate(5deg); }

        /* Đốm đỏ cháy ở đầu nhang */
