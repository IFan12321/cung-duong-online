<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đền Thờ Quan Thánh Đế Quân - Cúng Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0301;
            font-family: 'Noto Serif', serif;
            color: #f4e8c1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px 10px;
        }

        .temple-wrapper {
            width: 100%;
            max-width: 650px;
            background: #1c0602;
            border: 4px solid #d4af37;
            border-radius: 12px;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.3), 0 10px 40px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        /* --- MÁI ĐỀN THỜ --- */
        .roof-header {
            background: linear-gradient(to bottom, #8b0000, #4a0000);
            text-align: center;
            padding: 15px 10px;
            border-bottom: 4px solid #d4af37;
        }
