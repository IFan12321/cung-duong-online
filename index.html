<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điện Thờ Quan Công - Cúng Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0c0301;
            font-family: 'Noto Serif', serif;
            color: #f4e8c1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px 10px;
        }

        .main-container {
            width: 100%;
            max-width: 680px;
            background: #1a0602;
            border: 3px solid #d4af37;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3), 0 10px 40px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        /* --- KHUNG CẢNH ĐIỆN THỜ CHÍNH DIỆN --- */
        .shrine-view {
            position: relative;
            width: 100%;
            height: 440px;
            background-color: #2a0a04;
            background-image: url('https://i.imgur.com/83uXm5g.jpg'); /* Hình ảnh điện thờ Quan Công đọc sách chính diện */
            background-size: cover;
            background-position: center;
            border-bottom: 4px solid #d4af37;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* LƯ HƯƠNG & NHANG ĐẶT TẠI BÀN THỜ CHÍNH DIỆN */
        .incense-burner-area {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 60px;
            z-index: 10;
        }

        /* 3 CÂY NHANG & KHÓI BAY */
        .incense-sticks {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 50px;
            display: none;
            z-index: 11;
        }

        .stick {
            position: absolute;
            bottom: 0;
            width: 3px;
            height: 45px;
            background: linear-gradient(to top, #900c3f, #ff5733);
            border-radius: 1px;
        }
        .stick.s1 { left: 6px; transform: rotate(-5deg); }
        .stick.s2 { left: 16px; }
        .stick.s3 { left: 26px; transform: rotate(5deg); }

        /* Đốm đỏ đầu nhang */
        .stick::before {
            content: '';
            position: absolute;
            top: 0;
            left: -1px;
            width: 5px;
            height: 5px;
            background: #ff2a2a;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff4d4d, 0 0 12px #fffa65;
        }

        /* Làn khói nhang bay lên */
        .smoke-particle {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 16px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            filter: blur(5px);
            opacity: 0;
        }

        .active-smoke .smoke-particle {
            animation: riseUpSmoke 3.5s infinite ease-out;
        }
        .active-smoke .smoke-particle:nth-child(2) { animation-delay: 1.2s; }
        .active-smoke .smoke-particle:nth-child(3) { animation-delay: 2.4s; }

        @keyframes riseUpSmoke {
            0% { transform: translate(-50%, 0) scale(0.6); opacity: 0; }
            25% { opacity: 0.75; }
            100% { transform: translate(calc(-50% + 20px), -100px) scale(3); opacity: 0; }
        }

        /* --- BẢNG ĐIỀU KHIỂN & KHẤN NGUYỆN --- */
        .control-panel {
            padding: 20px 25px;
            background: linear-gradient(to bottom, #1d0703, #0d0200);
            text-align: center;
        }

        .panel-title {
            color: #ffd700;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            text-shadow: 0 0 6px rgba(255, 215, 0, 0.4);
            letter-spacing: 1px;
        }

        textarea {
            width: 100%;
            height: 95px;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #d4af37;
            background: #080201;
            color: #fff8dc;
            font-family: 'Noto Serif', serif;
            font-size: 15px;
            resize: none;
            outline: none;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.9);
        }

        textarea::placeholder {
            color: #8a734e;
        }

        textarea:focus {
            border-color: #f39c12;
            box-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
        }

        .btn-thap-nhang {
            margin-top: 15px;
            background: linear-gradient(to bottom, #e67e22, #a04000);
            color: #ffffff;
            border: 2px solid #ffd700;
            padding: 12px 40px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            transition: all 0.3s ease;
            font-family: 'Noto Serif', serif;
            letter-spacing: 1px;
        }

        .btn-thap-nhang:hover {
            background: linear-gradient(to bottom, #f39c12, #d35400);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
        }

        .status-message {
            margin-top: 15px;
            font-style: italic;
            color: #ffd700;
            font-size: 15px;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Khung ảnh Điện Thờ Quan Công Chính Diện -->
        <div class="shrine-view">
            <!-- Khu vực thắp nhang vào lư hương -->
            <div class="incense-burner-area">
                <div class="incense-sticks" id="incenseSticks">
                    <div class="stick s1"></div>
                    <div class="stick s2"></div>
                    <div class="stick s3"></div>
                    <div class="smoke-particle"></div>
                    <div class="smoke-particle"></div>
                    <div class="smoke-particle"></div>
                </div>
            </div>
        </div>

        <!-- Khhu vực Nhập Nguyện Ước -->
        <div class="control-panel">
            <div class="panel-title">ĐỆ TRÌNH NGUYỆN ƯỚC</div>
            <textarea id="wishInput" placeholder="Nhập lời nguyện ước của bạn gửi đến Quan Thánh Đế Quân..."></textarea>
            <br>
            <button class="btn-thap-nhang" onclick="thapNhang()">THẮP NHANG</button>
            <div class="status-message" id="statusMessage"></div>
        </div>
    </div>

    <!-- Tệp Âm Thanh Hòa Tấu -->
    <audio id="bgMusic" loop preload="auto">
