<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đền Thờ Quan Công Online - Cầu An & Chiêm Bái</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0d0805;
            color: #f3e5ab;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Khung hiển thị đền thờ */
        .shrine-wrapper {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 16 / 9;
            margin: 15px auto 0 auto;
            border: 3px solid #d4af37;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 20px rgba(212, 175, 55, 0.3);
            overflow: hidden;
            background-color: #000;
        }

        /* Bức ảnh đền thờ góc chính diện */
        .shrine-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Vùng hiệu ứng nhang cắm đúng lư hương */
        .incense-position {
            position: absolute;
            left: 50%;
            bottom: 24.5%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        /* 3 nén nhang */
        .sticks-group {
            display: flex;
            gap: 6px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.8s ease-in-out;
        }

        .sticks-group.active {
            opacity: 1;
            transform: translateY(0);
        }

        .stick {
            width: 3px;
            height: 38px;
            background: linear-gradient(to bottom, #d2691e, #8b4513);
            position: relative;
            border-radius: 1px;
        }

        /* Đốm lửa đỏ ở đầu nhang */
        .stick::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -1.5px;
            width: 6px;
            height: 6px;
            background: #ff3300;
            border-radius: 50%;
            box-shadow: 0 0 6px #ff4500, 0 0 12px #ff0000;
            animation: glow 1.2s infinite alternate ease-in-out;
        }

        @keyframes glow {
            0% { opacity: 0.7; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        /* Khói nhang bay lên */
        .smoke-group {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 10px;
            opacity: 0;
            transition: opacity 1s ease;
        }

            opacity: 1;
