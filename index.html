<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đền Thờ Quan Thánh Đế Quân - Cúng Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0200;
            font-family: 'Noto Serif', serif;
            color: #f4e8c1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px 10px;
        }

        .temple-box {
            width: 100%;
            max-width: 700px;
            background: #1a0601;
            border: 4px solid #d4af37;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.35), 0 15px 45px rgba(0,0,0,0.95);
            overflow: hidden;
        }

        /* --- KHÔNG GIAN ĐIỆN THỜ THẬT --- */
        .shrine-scene {
            position: relative;
            width: 100%;
            height: 450px;
            /* Lấy hình ảnh điện thờ Quan Công cực kỳ chân thực, sang trọng như chùa lớn */
            background-image: url('https://images.unsplash.com/photo-1548013146-72479768bada?q=80&w=1200&auto=format&fit=crop');
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.6)), url('https://i.imgur.com/83uXm5g.jpg');
            background-size: cover;
            background-position: center;
            border-bottom: 5px solid #d4af37;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* KHU VỰC LƯ HƯƠNG Ở BÀN THỜ */
        .burner-area {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 50px;
            z-index: 10;
        }

        /* 3 CÂY NHANG & KHÓI */
        .incense-group {
            position: absolute;
            top: -32px;
            left: 50%;
            transform: translateX(-50%);
            width: 35px;
            height: 55px;
            display: none;
            z-index: 11;
        }

        .stick {
            position: absolute;
            bottom: 0;
            width: 2.5px;
            height: 48px;
            background: linear-gradient(to top, #7d1100, #ff5733);
            border-radius: 1px;
        }
        .stick.s1 { left: 5px; transform: rotate(-5deg); }
        .stick.s2 { left: 16px; }
        .stick.s3 { left: 27px; transform: rotate(5deg); }

        /* Đốm đỏ đầu nhang */
        .stick::before {
            content: '';
            position: absolute;
            top: 0;
            left: -1px;
            width: 5px;
            height: 5px;
            background: #ff2a2a;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff4d4d, 0 0 12px #ffff66;
        }

        /* Làn khói nhang bay lên */
        .smoke {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 18px;
            background: rgba(255, 255, 255, 0.55);
            border-radius: 50%;
            filter: blur(5px);
            opacity: 0;
        }

        .active-smoke .smoke {
            animation: riseSmoke 3.2s infinite ease-out;
        }
        .active-smoke .smoke:nth-child(2) { animation-delay: 1.1s; }
        .active-smoke .smoke:nth-child(3) { animation-delay: 2.2s; }

        @keyframes riseSmoke {
            0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
            30% { opacity: 0.7; }
            100% { transform: translate(calc(-50% + 22px), -95px) scale(3.2); opacity: 0; }
        }

        /* --- BẢNG ĐIỀU KHIỂN NGUYỆN ƯỚC --- */
        .control-section {
            padding: 25px 20px;
            background: linear-gradient(to bottom, #1f0701, #0a0100);
            text-align: center;
        }

        .section-title {
            color: #ffd700;
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 12px;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
            letter-spacing: 1px;
        }

        textarea {
            width: 100%;
            height: 95px;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #d4af37;
            background: #080201;
            color: #fff8dc;
            font-family: 'Noto Serif', serif;
            font-size: 15px;
            resize: none;
            outline: none;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.9);
        }

        textarea::placeholder {
            color: #8c734b;
        }

        textarea:focus {
            border-color: #f39c12;
            box-shadow: 0 0 12px rgba(243, 156, 18, 0.6);
        }

        .btn-thap-nhang {
            margin-top: 16px;
            background: linear-gradient(to bottom, #e67e22, #963b00);
            color: #ffffff;
            border: 2px solid #ffd700;
            padding: 12px 42px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            transition: all 0.3s ease;
            font-family: 'Noto Serif', serif;
            letter-spacing: 1px;
        }

        .btn-thap-nhang:hover {
            background: linear-gradient(to bottom, #f39c12, #d35400);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
        }

        .wish-status {
            margin-top: 15px;
            font-style: italic;
            color: #ffd700;
            font-size: 15px;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="temple-box">
        <!-- Khung cảnh điện thờ chân thực -->
        <div class="shrine-scene">
            <!-- Vị trí cắm 3 cây nhang và khói -->
            <div class="burner-area">
                <div class="incense-group" id="incenseGroup">
                    <div class="stick s1"></div>
                    <div class="stick s2"></div>
                    <div class="stick s3"></div>
                    <div class="smoke"></div>
                    <div class="smoke"></div>
                    <div class="smoke"></div>
                </div>
            </div>
        </div>

        <!-- Bảng nhập nguyện ước -->
        <div class="control-section">
            <div class="section-title">THÀNH TÂM KHẤN NGUYỆN QUAN THÁNH ĐẾ QUÂN</div>
            <textarea id="wishInput" placeholder="Nhập nguyện ước của bạn (Cầu bình an, tài lộc, sự nghiệp...)...."></textarea>
            <br>
            <button class="btn-thap-nhang" onclick="thapNhang()">THẮP NHANG</button>
            <div class="wish-status" id="wishStatus"></div>
        </div>
    </div>

    <!-- Tệp Âm Thanh Hòa Tấu -->
    <audio id="bgMusic" loop preload="auto">
        <source src="Bông Cỏ May New Hòa Tấu.mp3" type="audio/mpeg">
        <source src="nhac.mp3" type="audio/mpeg">
    </audio>

    <script>
        function thapNhang() {
            const wish = document.getElementById('wishInput').value.trim();
            const incenseGroup = document.getElementById('incenseGroup');
            const wishStatus = document.getElementById('wishStatus');
            const music = document.getElementById('bgMusic');

            if (wish === "") {
                alert("Xin thành tâm nhập lời nguyện ước trước khi thắp nhang!");
                return;
            }

            // Hiển thị 3 cây nhang và làn khói bay
            incenseGroup.style.display = 'block';
            incenseGroup.classList.add('active-smoke');

            // Bật nhạc hòa tấu
            music.play().catch(err => {
                console.log("Trình duyệt chặn phát nhạc tự động.");
            });

            // Hiển thị thông báo thành kính
            wishStatus.innerHTML = "🙏 Nguyện ước của bạn đã được Quan Thánh Đế Quân chứng giám!";
            
            // Xóa ô nhập sau khi gửi
            document.getElementById('wishInput').value = "";
        }
    </script>

</body>
</html>
